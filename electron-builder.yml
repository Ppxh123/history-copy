appId: com.clipboard-history.app
productName: 历史粘贴板
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
win:
  target: nsis
  icon: assets/icon.png
  sign: null
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  language: "2052"
