<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 56px; height: 56px;
    overflow: hidden;
    user-select: none;
    background: transparent;
  }
  .ball {
    width: 48px; height: 48px; margin: 4px;
    border-radius: 50%;
    background: #5B9BD5;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    transition: transform 0.15s;
    cursor: pointer;
  }
  .ball:hover {
    transform: scale(1.08);
  }
  .ball:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>
<div class="ball">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2" ry="2" />
    <line x1="8" y1="7" x2="16" y2="7" />
    <line x1="8" y1="11" x2="14" y2="11" />
  </svg>
</div>
<script>
  let dragging = false;
  let startX = 0, startY = 0;
  let moved = false;

  const ball = document.querySelector('.ball');

  ball.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    moved = false;
    startX = e.screenX;
    startY = e.screenY;
    window.floatingBallAPI.onDragStart(e.screenX, e.screenY);
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    if (Math.abs(e.screenX - startX) > 2 || Math.abs(e.screenY - startY) > 2) {
      moved = true;
      window.floatingBallAPI.onDrag(e.screenX, e.screenY);
    }
  });

  document.addEventListener('mouseup', () => {
    if (dragging && !moved) {
      window.floatingBallAPI.onClick();
    }
    dragging = false;
    moved = false;
  });
</script>
</body>
</html>
